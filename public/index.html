<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinhAnh Store - Quản Trị Bảo Mật</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); width: 100%; max-width: 450px; border: 1px solid #334155; }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; font-size: 24px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: white; font-size: 15px; transition: 0.2s; }
        input:focus { border-color: #38bdf8; outline: none; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
        button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0ea5e9; }
        .btn-danger { background: #e11d48; margin-top: 10px; }
        .btn-danger:hover { background: #f43f5e; }
        .hidden { display: none; }
        .alert { padding: 12px; margin-bottom: 20px; border-radius: 6px; font-size: 14px; text-align: center; background: #334155; color: #cbd5e1; }
        .user-info { background: #0f172a; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #334155; }
        hr { border: 0; border-top: 1px solid #334155; margin: 20px 0; }
    </style>
</head>
<body>

<div class="card">
    <h2>MinhAnh Store</h2>
    <div id="status-message" class="alert">Đang kiểm tra bảo mật...</div>

    <!-- Form Đăng Nhập -->
    <div id="login-section">
        <div class="form-group">
            <label>Tên đăng nhập</label>
            <input type="text" id="username" placeholder="Nhập tài khoản admin...">
        </div>
        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu...">
        </div>
        <div class="form-group hidden" id="otp-group">
            <label>Mã Google Authenticator (6 số)</label>
            <input type="text" id="otpToken" placeholder="Nhập mã OTP từ app...">
        </div>
        <button onclick="login()">Đăng Nhập Hệ Thống</button>
    </div>

    <!-- Khu vực Admin Xịn Sò -->
    <div id="admin-section" class="hidden">
        <div class="user-info">
            <p><strong>Quản trị viên:</strong> <span id="user-display" style="color: #38bdf8;"></span></p>
            <p><strong>Số dư quỹ:</strong> <span id="balance-display" style="color: #4ade80;">0</span>đ</p>
        </div>

        <h3 style="font-size: 16px; margin-bottom: 10px; color: #cbd5e1;">Thêm Sản Phẩm Mới</h3>
        <div class="form-group">
            <input type="text" id="prodName" placeholder="Tên sản phẩm...">
        </div>
        <div class="form-group">
            <input type="number" id="prodPrice" placeholder="Giá tiền (VNĐ)...">
        </div>
        <button onclick="addProduct()">Thêm Sản Phẩm</button>

        <button onclick="logout()" class="btn-danger">Đăng Xuất</button>
    </div>
</div>

<script>
    async function checkAuth() {
        const res = await fetch('/api/me');
        const data = await res.json();
        const msgBox = document.getElementById('status-message');

        if (data.success) {
            msgBox.style.display = 'none';
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('admin-section').classList.remove('hidden');
            document.getElementById('user-display').innerText = data.user.username;
            document.getElementById('balance-display').innerText = data.user.balance.toLocaleString();
        } else {
            msgBox.innerText = 'Vui lòng đăng nhập để quản trị.';
        }
    }

    async function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const otpToken = document.getElementById('otpToken').value;

        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password, otpToken })
        });
        const data = await res.json();

        if (data.require2FA) {
            document.getElementById('otp-group').classList.remove('hidden');
            alert(data.message);
        } else if (data.success) {
            location.reload();
        } else {
            alert(data.message);
        }
    }

    async function addProduct() {
        const name = document.getElementById('prodName').value;
        const price = document.getElementById('prodPrice').value;

        const res = await fetch('/api/admin/add-product', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, price })
        });
        const data = await res.json();
        alert(data.message);
        if (data.success) {
            document.getElementById('prodName').value = '';
            document.getElementById('prodPrice').value = '';
        }
    }

    async function logout() {
        await fetch('/api/logout', { method: 'POST' });
        location.reload();
    }

    checkAuth();
</script>

</body>
</html>
